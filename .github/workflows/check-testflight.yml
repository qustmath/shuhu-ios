name: Check TestFlight

# 手动触发：直连 App Store Connect REST API 查构建处理状态（结果以注解回读，无需认证）
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Query builds via ASC REST API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          pip3 install --quiet pyjwt cryptography 2>/dev/null || pip3 install --quiet --break-system-packages pyjwt cryptography
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/builds.log
          import base64, json, os, time, urllib.request
          import jwt

          key = base64.b64decode(os.environ["ASC_KEY_P8_B64"]).decode()
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_KEY_ISSUER_ID"], "iat": now, "exp": now + 1200,
               "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          headers = {"Authorization": "Bearer " + token}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          apps = get("https://api.appstoreconnect.com/v1/apps?filter[bundleId]=ink.groovy.shuhu")
          if not apps["data"]:
              print("APP-RECORD: 不存在（App Store Connect 里还没建应用记录）")
              raise SystemExit(0)
          app = apps["data"][0]
          print("APP:", app["id"], app["attributes"]["name"], app["attributes"]["bundleId"])

          builds = get(
              "https://api.appstoreconnect.com/v1/builds"
              f"?filter[app]={app['id']}&fields[builds]=version,processingState,uploadedDate"
              "&sort=-uploadedDate&limit=10")
          if not builds["data"]:
              print("BUILDS: 上传的构建尚未进入处理队列（Apple 入库延迟，再等几分钟）")
          for b in builds["data"]:
              a = b["attributes"]
              print(f"BUILD {a['version']} | {a['processingState']} | {a['uploadedDate']}")
          PY

      - name: Surface status
        if: always()
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice::${line:0:400}"
          done < /tmp/builds.log
