name: Release (TestFlight)

# 手动触发：发 TestFlight 内测包。
# 签名采用手动模式（CI 无 Apple 账号登录，自动签名不可靠——jjt-ios 同款结论）：
# 证书 = 分发证书 p12（secret DIST_*），描述文件 = "Shufu App Store"（ASC API 预创建）。
# Secrets：ASC_KEY_ID / ASC_KEY_ISSUER_ID / ASC_KEY_P8_B64（pilot 上传用），
#          DIST_P12_B64 / DIST_P12_PASSWORD / DIST_PROFILE_B64（签名用）。
#
# 两种触发方式：
# 1. 手动：GitHub → Actions → Run workflow（或 PAT 调 dispatches）。
# 2. 推标签：git tag release-<版本>-<日期> && git push origin <tag> ——
#    开发机网络到 github.com / dispatches API 均不通（仅 api.github.com 只读可用），
#    SSH 推标签是唯一可靠的本机触发通道。
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 本包测试内容（TestFlight 展示给测试员）
        required: false
        default: ''
  push:
    tags:
      - 'release-*'

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i xcode
          for X in /Applications/Xcode_26*.app; do sudo xcode-select -s "$X"; done
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install signing assets (keychain + profile)
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_B64: ${{ secrets.DIST_PROFILE_B64 }}
        run: |
          set -euo pipefail
          security create-keychain -p ci-pass build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-pass build.keychain
          echo "$DIST_P12_B64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k build.keychain -P "$DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-pass build.keychain \
            >/dev/null
          PROFILE_UUID="48ba2855-56c5-45c0-8ddd-f8d4badf4f62"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$DIST_PROFILE_B64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security find-identity -v -p codesigning build.keychain

      - name: Archive (manual signing)
        run: |
          set -euo pipefail
          # 手动签名在 project.yml 的 Release 配置里表达（仅 Shuhu 目标）；
          # SPM 依赖 GRDB 保持 Automatic（框架无描述文件概念），命令行不再覆盖
          xcodebuild archive \
            -project Shuhu.xcodeproj \
            -scheme Shuhu \
            -configuration Release \
            -archivePath build/Shuhu.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee /tmp/archive.log | xcbeautify

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/Shuhu.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build \
            | tee /tmp/export.log | xcbeautify
          ls -la build/*.ipa

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Upload to TestFlight (fastlane pilot)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          brew install fastlane
          test -f build/Shuhu.ipa
          python3 - <<'PY'
          import base64, json, os
          key = base64.b64decode(os.environ["ASC_KEY_P8_B64"]).decode()
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_KEY_ISSUER_ID"],
                     "key": key, "in_house": False}, open("/tmp/asc_key.json", "w"))
          PY
          fastlane pilot upload \
            --ipa build/Shuhu.ipa \
            --api_key_path /tmp/asc_key.json \
            --changelog "${{ github.event.inputs.changelog }}" \
            --skip_waiting_for_build_processing true \
            2>&1 | tee /tmp/upload.log

      # 失败详情以注解输出（开发机在 Ubuntu，原始日志需管理员权限下载）
      - name: Surface failures
        if: failure()
        run: |
          for f in /tmp/archive.log /tmp/export.log /tmp/upload.log; do
            [ -f "$f" ] && grep -E "error:|fatal|\[!\]" "$f" | head -30 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
          done
          tail -30 /tmp/archive.log 2>/dev/null | while IFS= read -r line; do echo "::error::ARCH ${line:0:300}"; done
