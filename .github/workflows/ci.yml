name: CI

# Ubuntu 开发机无法运行 Xcode：编译与测试全部在 GitHub Actions 的 macOS runner 上进行。
# 工作流：XcodeGen 生成工程 → xcodebuild 在 iOS 模拟器跑全量单测。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # runner 镜像里的模拟器会漂移：2026-09-21 有 run 因
      # `Unable to find a device matching the provided destination specifier`（硬编码 iPhone 16）
      # 间歇失败。改为按 UDID 选当前镜像上真实可用的第一个 iPhone 模拟器。
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          AVAILABLE=$(xcrun simctl list devices available)
          echo "$AVAILABLE" | grep -E "iPhone" | head -10 || true
          UDID=$(echo "$AVAILABLE" | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}" || true)
          if [ -z "$UDID" ]; then
            echo "::error::runner 上没有可用的 iPhone 模拟器"
            exit 1
          fi
          echo "选中模拟器 UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          # 2>&1 必须带上：xcodebuild 的致命错误（如包解析失败、destination 不可用）走 stderr，
          # 只 tee stdout 会让日志里只剩前半段，失败原因完全查不到（2026-09-21 踩过）
          xcodebuild test \
            -project Shuhu.xcodeproj \
            -scheme Shuhu \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            2>&1 | tee /tmp/xcodebuild.log | xcbeautify --quiet

      # 失败详情以注解形式输出（开发机在 Ubuntu、拿不到 Actions 日志下载权限，只能读注解）
      - name: Surface failures
        if: failure()
        run: |
          grep -E "Test Case .*(failed|error|crashed)|error:|Fatal error|Testing failed|Failing tests|crashed" /tmp/xcodebuild.log | head -30 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
          # 尾日志塞进**一条**注解（%0A 转义换行）：按行拆成几十条注解时 GitHub 只留前若干条，
          # 真正的现场（XCUITest 活动日志 / App event loop 之类）反而看不到（2026-09-21 踩过）。
          ENCODED=$(tail -150 /tmp/xcodebuild.log | sed 's/%/%25/g; s/\r//g' | awk '{ printf "%s%%0A", $0 }')
          echo "::error::LOGTAIL ${ENCODED:0:24000}"

      - name: Build for device (unsigned, smoke)
        run: |
          xcodebuild build \
            -project Shuhu.xcodeproj \
            -scheme Shuhu \
            -destination 'generic/platform=iOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
