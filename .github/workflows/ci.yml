name: CI

# Ubuntu 开发机无法运行 Xcode：编译与测试全部在 GitHub Actions 的 macOS runner 上进行。
# 工作流：XcodeGen 生成工程 → xcodebuild 在 iOS 模拟器跑全量单测。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Shuhu.xcodeproj \
            -scheme Shuhu \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            | tee /tmp/xcodebuild.log | xcbeautify --quiet

      # 失败详情以注解形式输出（无需认证即可从 API 读取，开发机在 Ubuntu 上）
      - name: Surface failures
        if: failure()
        run: |
          grep -E "Test Case .*(failed|error)|error:|Fatal error|Failing tests" /tmp/xcodebuild.log | head -50 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
          echo "---- last lines ----"
          tail -40 /tmp/xcodebuild.log | while IFS= read -r line; do
            echo "::error::TAIL ${line:0:300}"
          done

      - name: Build for device (unsigned, smoke)
        run: |
          xcodebuild build \
            -project Shuhu.xcodeproj \
            -scheme Shuhu \
            -destination 'generic/platform=iOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
