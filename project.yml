name: Shuhu
options:
  bundleIdPrefix: ink.groovy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# 依赖（SPM）：GRDB = SQLite 的 Swift 封装（迁移/事务/并发模型与 Android Room 同构）
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 6.29.3

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Program Team ID（微信 iPhone 应用登记、签名、AASA 三方共用）
    DEVELOPMENT_TEAM: RHXA5ZS73K

targets:
  Shuhu:
    type: application
    platform: iOS
    sources:
      - Shuhu
    dependencies:
      - package: GRDB
    settings:
      base:
        # 与 Android 包名一致（微信开放平台 iPhone 应用登记值，勿改）
        PRODUCT_BUNDLE_IDENTIFIER: ink.groovy.shuhu
        INFOPLIST_FILE: Shuhu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        # 手动签名仅作用于 App 目标（SPM 依赖 GRDB 不支持描述文件，保持 Automatic）；
        # 证书与描述文件来自 ASC API 预创建资产（CI Secrets 注入）
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Shufu App Store
          DEVELOPMENT_TEAM: RHXA5ZS73K

  ShuhuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShuhuTests
    dependencies:
      - target: Shuhu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # XCUITest：手势/滚动这类只有在模拟器上真做手势才现形的行为（见 ShuhuUITests/HomeShelfUITests.swift）。
  # 只进 test 动作，archive 发版不构建它（Release 签名配置仍只作用于 App 目标）。
  ShuhuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ShuhuUITests
    dependencies:
      - target: Shuhu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Shuhu

schemes:
  Shuhu:
    build:
      targets:
        Shuhu: all
        ShuhuTests: [test]
        ShuhuUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShuhuTests
        - ShuhuUITests
