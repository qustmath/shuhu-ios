name: Shuhu
options:
  bundleIdPrefix: ink.groovy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# 依赖（SPM）：GRDB = SQLite 的 Swift 封装（迁移/事务/并发模型与 Android Room 同构）。
# 微信 SDK 不走 SPM：该包（yanyin1986/WechatOpenSDK）实为静态库，Xcode 会把 SPM
# binaryTarget 自动包成嵌入 framework，其 MinimumOSVersion 高于 app 部署目标，
# App Store 校验拒收 ITMS-90208（2026-10-13 两轮实测）——改为 Vendor/ 直接链静态库。
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 6.29.3

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Program Team ID（微信 iPhone 应用登记、签名、AASA 三方共用）
    DEVELOPMENT_TEAM: RHXA5ZS73K

targets:
  Shuhu:
    type: application
    platform: iOS
    sources:
      - Shuhu
      # SDK 静态库不进包，其隐私清单需作为 app 资源提供
      - path: Vendor/WechatOpenSDK/PrivacyInfo.xcprivacy
        buildPhase: resources
    # Universal Links 关联域（微信授权回跳用）：与微信开放平台后台登记值、
    # 服务器 /var/www/apple/.well-known/apple-app-site-association 三方一致，勿改。
    # ⚠️ Release 手动签名的描述文件必须重建并带 Associated Domains 能力，否则归档失败。
    entitlements:
      path: Shuhu/Shuhu.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:rrapi.groovyu.com
    dependencies:
      - package: GRDB
      # 微信静态库依赖的系统框架与系统库（SDK README 历年要求 + WKWebView/C++ 运行时）
      - sdk: SystemConfiguration.framework
      - sdk: CoreTelephony.framework
      - sdk: CFNetwork.framework
      - sdk: Security.framework
      - sdk: WebKit.framework
      - sdk: JavaScriptCore.framework
      - sdk: libz.tbd
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    settings:
      base:
        # 与 Android 包名一致（微信开放平台 iPhone 应用登记值，勿改）
        PRODUCT_BUNDLE_IDENTIFIER: ink.groovy.shuhu
        INFOPLIST_FILE: Shuhu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        # 微信 SDK：Vendor 静态库 + 手写 Clang module（Swift 侧 `import WechatOpenSDK` 不变）。
        # 静态库链进主执行文件，不产生任何嵌入 framework。
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Vendor/WechatOpenSDK"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor/WechatOpenSDK"
        OTHER_LDFLAGS: "$(inherited) -ObjC -lWechatOpenSDK"
      configs:
        # 手动签名仅作用于 App 目标（SPM 依赖 GRDB 不支持描述文件，保持 Automatic）；
        # 证书与描述文件来自 ASC API 预创建资产（CI Secrets 注入）
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Shufu App Store
          DEVELOPMENT_TEAM: RHXA5ZS73K

  ShuhuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShuhuTests
    dependencies:
      - target: Shuhu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # XCUITest：手势/滚动这类只有在模拟器上真做手势才现形的行为（见 ShuhuUITests/HomeShelfUITests.swift）。
  # 只进 test 动作，archive 发版不构建它（Release 签名配置仍只作用于 App 目标）。
  ShuhuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ShuhuUITests
    dependencies:
      - target: Shuhu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Shuhu

schemes:
  Shuhu:
    build:
      targets:
        Shuhu: all
        ShuhuTests: [test]
        ShuhuUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShuhuTests
        - ShuhuUITests
